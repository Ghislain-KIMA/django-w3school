{% extends "members/master.html" %}

{% block title %}
  My Tennis Club - List of all members
{% endblock %}


{% block content %}
  <div class="mycard">
    <h1>Members</h1>
    <ul>
      {% if mymembers %}
        {% for x in mymembers %}
          <li onclick="window.location = 'details/{{ x.id }}'">
            {{ x.id }} {{ x.firstname }} {{ x.lastname }}
          </li>
        {% endfor %}
      {% endif %}
    </ul>
  </div>
{% endblock %}
